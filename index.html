<!DOCTYPE html>
<html>
<head>
    <title>Online Drawing Board</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="toolbar">
        <button id="colorPicker">Color</button>
        <input type="color" id="colorValue" value="#000000" style="display: none;">
        <button id="sizePicker">Size</button>
        <input type="range" id="sizeValue" min="1" max="20" value="5" style="display: none;">
        <button id="eraser">Eraser</button>
        <button id="clear">Clear</button>
    </div>
    <canvas id="drawingCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
